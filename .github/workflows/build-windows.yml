# WinCafe Windows installer.
# workflow_dispatch only. GitHub shows this button after the file is on the
# default branch. The run is unsigned and does not publish a release.
# Phone-home stays off for the build.
name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINCAFE_PHONE_HOME: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm ci

      - name: Build WinCafe and the NSIS installer
        shell: bash
        run: |
          npm run build:frontend && npm run build && npx electron-builder --win nsis --x64 --publish never --config.npmRebuild=false

      - name: Upload the Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wincafe-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
