name: qa-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

jobs:
  qa-gate:
    name: qa-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require qa-passed and reject qa-changes-requested
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          labels = {
              item.get("name")
              for item in json.loads(os.environ["PR_LABELS"])
          }
          print("labels:", ", ".join(sorted(label for label in labels if label)) or "(none)")
          if "qa-changes-requested" in labels:
              print("qa-gate failed: label qa-changes-requested is present")
              sys.exit(1)
          if "qa-passed" not in labels:
              print("qa-gate failed: label qa-passed is missing")
              sys.exit(1)
          print("qa-gate passed")
          PY
